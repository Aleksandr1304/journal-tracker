name: Публикация на GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      script_title:
        description: "Название ролика (для суфлёра)"
        required: false
        default: ""
      script_text:
        description: "Текст сценария (абзацы через пустую строку). Пусто = очистить сценарий на сайте."
        required: false
        default: ""
  schedule:
    - cron: "0 */6 * * *" # автоочистка сценария: каждые 6 часов сайт пересобирается без текста

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4
      - name: Сценарий суфлёра — из параметров запуска (в git не хранится)
        env:
          S_TITLE: ${{ inputs.script_title }}
          S_TEXT: ${{ inputs.script_text }}
        run: |
          python3 - <<'EOF'
          import json, os, datetime
          data = {
              "title": os.environ.get("S_TITLE") or "",
              "text": os.environ.get("S_TEXT") or "",
              "updatedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          json.dump(data, open("script.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print("сценарий:", "задан, знаков: %d" % len(data["text"]) if data["text"] else "пустой (очистка)")
          EOF
      - name: Собрать публичную версию суфлёра (prompter.html, без личного сценария)
        run: |
          python3 - <<'EOF'
          import re
          src = open('teleprompter.html', encoding='utf-8').read()
          out = re.sub(r'<!-- PERSONAL:START -->.*?<!-- PERSONAL:END -->', '', src, flags=re.S)
          out = re.sub(r'/\* PERSONAL:START \*/.*?/\* PERSONAL:END \*/', '', out, flags=re.S)
          assert 'PERSONAL' not in out, 'метки PERSONAL не вырезались полностью'
          assert 'script.json' not in out, 'в публичной версии остался script.json'
          open('prompter.html', 'w', encoding='utf-8').write(out)
          EOF
      - name: Настроить Pages (включается автоматически, если выключен)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Собрать сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
