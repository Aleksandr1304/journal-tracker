name: Публикация на GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4
      - name: Собрать публичную версию суфлёра (prompter.html)
        run: |
          python3 - <<'EOF'
          import re
          src = open('teleprompter.html', encoding='utf-8').read()
          out = re.sub(r'<!-- PERSONAL:START -->.*?<!-- PERSONAL:END -->', '', src, flags=re.S)
          out = re.sub(r'/\* PERSONAL:START \*/.*?/\* PERSONAL:END \*/', '', out, flags=re.S)
          # отдельное хранилище: публичная версия не видит локальные данные личной
          # (localStorage общий на весь домен, поэтому разводим ключи)
          out = out.replace("'prompter.", "'prompter.public.")
          assert 'PERSONAL' not in out, 'метки PERSONAL не вырезались полностью'
          assert "'prompter.public.script'" in out, 'ключи хранилища не разведены'
          open('prompter.html', 'w', encoding='utf-8').write(out)
          EOF
      - name: Настроить Pages (включается автоматически, если выключен)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Собрать сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
