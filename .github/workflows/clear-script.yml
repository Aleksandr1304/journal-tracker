name: Автоочистка текста суфлёра

on:
  schedule:
    - cron: "30 */6 * * *" # каждые 6 часов: стираем текст старше 6 часов
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Очистить script-drop, если текст старше 6 часов
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          if ! curl -sf -o s.json "https://raw.githubusercontent.com/${REPO}/script-drop/script.json?nocache=$(date +%s)"; then
            echo "текста нет — чистить нечего"
            exit 0
          fi
          NEED=$(python3 - <<'EOF'
          import json, datetime
          try:
              d = json.load(open('s.json'))
          except Exception:
              print('yes'); raise SystemExit
          if not d.get('text'):
              print('no'); raise SystemExit
          try:
              ts = datetime.datetime.fromisoformat(str(d.get('updatedAt', '1970-01-01T00:00:00Z')).replace('Z', '+00:00'))
          except Exception:
              print('yes'); raise SystemExit
          age = datetime.datetime.now(datetime.timezone.utc) - ts
          print('yes' if age.total_seconds() > 6 * 3600 else 'no')
          EOF
          )
          if [ "$NEED" != "yes" ]; then
            echo "текст свежий или уже пуст — оставляем"
            exit 0
          fi
          mkdir wipe && cd wipe && git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{\n  "title": "",\n  "text": "",\n  "updatedAt": "%s"\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > script.json
          git add script.json
          git commit -qm "автоочистка текста суфлёра"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:script-drop
          echo "текст очищен"
